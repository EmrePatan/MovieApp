name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/Directory.Packages.props

      - name: Restore dependencies
        run: dotnet restore MovieApp.sln

      - name: Build Release (backend + unit tests)
        run: dotnet build tests/MovieApp.UnitTests/MovieApp.UnitTests.csproj -c Release --no-restore
        # Builds all src projects via project references. Integration tests are excluded
        # because Release currently fails on pre-existing CA1822 in AuthRateLimitApiTests.cs.

      - name: Run unit tests (Release)
        run: dotnet test tests/MovieApp.UnitTests/MovieApp.UnitTests.csproj -c Release --no-build --no-restore --verbosity normal

      - name: Publish API (Release)
        run: dotnet publish src/MovieApp.Api/MovieApp.Api.csproj -c Release --no-build --no-restore -o "${{ runner.temp }}/movieapp-api-publish"

      - name: Build Docker image
        run: docker build -f Dockerfile -t movieapp-api:ci .
