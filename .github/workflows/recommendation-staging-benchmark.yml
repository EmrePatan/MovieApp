name: Recommendation Staging Benchmark

on:
  workflow_dispatch:
  push:
    branches:
      - research/recommendation-keyword-first-benchmark
    paths:
      - .github/workflows/recommendation-staging-benchmark.yml
      - tools/recommendation_staging_export.py
      - tools/sql/recommendation_candidate_export_staging.sql
      - tools/recommendation_synthetic_profiles.py
      - tools/recommendation_retrieval_audit.py
      - tools/recommendation_audit_summary.py

permissions:
  contents: read

jobs:
  staging-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      MOVIEAPP_STAGING_POSTGRES_CONNECTION: ${{ secrets.MOVIEAPP_STAGING_POSTGRES_CONNECTION }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
      - name: Export staging catalog (read-only, fail closed)
        run: python tools/recommendation_staging_export.py
      - name: Generate synthetic profiles
        run: |
          python tools/recommendation_synthetic_profiles.py \
            --input "$RUNNER_TEMP/recommendation-catalog.json" \
            --output "$RUNNER_TEMP/recommendation-profiles.json" --profiles 12
      - name: Compare retrieval strategies
        run: |
          python tools/recommendation_retrieval_audit.py \
            --input "$RUNNER_TEMP/recommendation-profiles.json" \
            --budget 500 --top-k 10 > "$RUNNER_TEMP/recommendation-audit.json"
          python tools/recommendation_audit_summary.py \
            --input "$RUNNER_TEMP/recommendation-audit.json"
      - name: Remove local data
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/recommendation-catalog.json" \
                "$RUNNER_TEMP/recommendation-profiles.json" \
                "$RUNNER_TEMP/recommendation-audit.json"
