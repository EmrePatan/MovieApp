name: Production Database Migrate

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type "production" to confirm migration against the production database
        required: true
        type: string

concurrency:
  group: production-database-migrate
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate-production:
    name: Apply EF migrations (production)
    runs-on: ubuntu-latest

    steps:
      - name: Validate manual confirmation
        run: |
          if [ "${{ inputs.confirm }}" != "production" ]; then
            echo "::error::Confirmation input must be exactly \"production\"."
            exit 1
          fi

      - name: Validate production PostgreSQL secret
        env:
          MOVIEAPP_PRODUCTION_POSTGRES_CONNECTION: ${{ secrets.MOVIEAPP_PRODUCTION_POSTGRES_CONNECTION }}
        run: |
          if [ -z "$MOVIEAPP_PRODUCTION_POSTGRES_CONNECTION" ]; then
            echo "::error::Missing required GitHub Actions secret MOVIEAPP_PRODUCTION_POSTGRES_CONNECTION."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/Directory.Packages.props

      - name: Diagnose PostgreSQL connectivity
        env:
          MOVIEAPP_PRODUCTION_POSTGRES_CONNECTION: ${{ secrets.MOVIEAPP_PRODUCTION_POSTGRES_CONNECTION }}
        run: |
          set -euo pipefail

          PROJECT_DIR="$RUNNER_TEMP/pg-connectivity-diag"
          PROJECT_FILE="$PROJECT_DIR/PgConnectivityDiag.csproj"
          PROGRAM_FILE="$PROJECT_DIR/Program.cs"
          NPgsql_CONNECTION_FILE="$RUNNER_TEMP/npgsql-connection.txt"

          rm -rf "$PROJECT_DIR"
          rm -f "$NPgsql_CONNECTION_FILE"
          mkdir -p "$PROJECT_DIR"
          export NPgsql_CONNECTION_FILE

          cat > "$PROJECT_FILE" << 'EOF'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net10.0</TargetFramework>
              <ImplicitUsings>enable</ImplicitUsings>
              <Nullable>enable</Nullable>
            </PropertyGroup>
            <ItemGroup>
              <PackageReference Include="Npgsql" Version="10.0.0" />
            </ItemGroup>
          </Project>
          EOF

          cat > "$PROGRAM_FILE" << 'EOF'
          using System.Net;
          using System.Net.Sockets;
          using System.Text.RegularExpressions;
          using Npgsql;

          var rawConnectionString = Environment.GetEnvironmentVariable("MOVIEAPP_PRODUCTION_POSTGRES_CONNECTION");
          var outputConnectionFile = Environment.GetEnvironmentVariable("NPgsql_CONNECTION_FILE");
          if (string.IsNullOrWhiteSpace(rawConnectionString))
          {
              Console.Error.WriteLine("::error::Missing MOVIEAPP_PRODUCTION_POSTGRES_CONNECTION.");
              return 1;
          }

          if (string.IsNullOrWhiteSpace(outputConnectionFile))
          {
              Console.Error.WriteLine("::error::Missing NPgsql_CONNECTION_FILE.");
              return 1;
          }

          var trimmedConnectionString = rawConnectionString.Trim();
          if (!string.Equals(rawConnectionString, trimmedConnectionString, StringComparison.Ordinal))
          {
              Console.WriteLine("Warning: connection string contained leading or trailing whitespace and was trimmed.");
          }

          var isPostgresUri = IsPostgresUri(trimmedConnectionString);

          NpgsqlConnectionStringBuilder builder;
          try
          {
              builder = isPostgresUri
                  ? ParsePostgresUri(trimmedConnectionString)
                  : new NpgsqlConnectionStringBuilder(trimmedConnectionString);
          }
          catch (Exception ex)
          {
              Console.Error.WriteLine($"::error::Connection string could not be parsed: {Sanitize(ex.Message, rawConnectionString, trimmedConnectionString)}");
              return 1;
          }

          ApplyRenderExternalSslDefaults(builder);

          var host = builder.Host ?? string.Empty;
          if (string.IsNullOrWhiteSpace(host))
          {
              Console.Error.WriteLine("::error::Connection string Host is missing or empty.");
              return 1;
          }

          if (host.StartsWith("tcp://", StringComparison.OrdinalIgnoreCase))
          {
              Console.Error.WriteLine("::error::Host must not include the tcp:// scheme. Use the hostname only (for example: dpg-xxxxx-a.frankfurt-postgres.render.com).");
              return 1;
          }

          if (host.Contains("://", StringComparison.Ordinal))
          {
              Console.Error.WriteLine("::error::Host must not include a URL scheme. Use the hostname only.");
              return 1;
          }

          var secrets = BuildSecrets(rawConnectionString, trimmedConnectionString, builder);

          Console.WriteLine("=== PostgreSQL connection diagnostics (sanitized) ===");
          Console.WriteLine($"Input format: {(isPostgresUri ? "PostgreSQL URI (Render external URL)" : "Npgsql key/value")}");
          Console.WriteLine($"Host: {host}");
          Console.WriteLine($"Port: {builder.Port}");
          Console.WriteLine($"Database: {(string.IsNullOrWhiteSpace(builder.Database) ? "(not set)" : builder.Database)}");
          Console.WriteLine($"Username: {MaskUsername(builder.Username)}");
          Console.WriteLine($"SslMode: {builder.SslMode}");
          Console.WriteLine($"Timeout: {builder.Timeout}s");
          Console.WriteLine($"CommandTimeout: {builder.CommandTimeout}s");

          try
          {
              var addresses = await Dns.GetHostAddressesAsync(host);
              if (addresses.Length == 0)
              {
                  Console.Error.WriteLine("::error::DNS lookup returned no addresses for the configured host.");
                  return 1;
              }

              Console.WriteLine($"DNS: resolved {addresses.Length} address(es): {string.Join(", ", addresses.Select(static address => address.ToString()))}");
          }
          catch (Exception ex)
          {
              Console.Error.WriteLine($"::error::DNS lookup failed for host '{host}': {Sanitize(ex.Message, secrets)}");
              return 1;
          }

          try
          {
              using var tcpClient = new TcpClient();
              var connectTask = tcpClient.ConnectAsync(host, builder.Port);
              var completed = await Task.WhenAny(connectTask, Task.Delay(TimeSpan.FromSeconds(15))) == connectTask;
              if (!completed)
              {
                  Console.Error.WriteLine($"::error::TCP connection to {host}:{builder.Port} timed out after 15 seconds.");
                  return 1;
              }

              await connectTask;
              Console.WriteLine($"TCP: reachable on {host}:{builder.Port}");
          }
          catch (Exception ex)
          {
              Console.Error.WriteLine($"::error::TCP connection to {host}:{builder.Port} failed: {Sanitize(ex.Message, secrets)}");
              return 1;
          }

          builder.Timeout = Math.Max(builder.Timeout, 15);
          builder.CommandTimeout = Math.Max(builder.CommandTimeout, 30);

          try
          {
              await using var connection = new NpgsqlConnection(builder.ConnectionString);
              await connection.OpenAsync();

              await using var command = new NpgsqlCommand("SELECT 1", connection);
              var result = await command.ExecuteScalarAsync();
              if (result is not null && Convert.ToInt32(result) == 1)
              {
                  var outputDirectory = Path.GetDirectoryName(outputConnectionFile);
                  if (!string.IsNullOrWhiteSpace(outputDirectory))
                  {
                      Directory.CreateDirectory(outputDirectory);
                  }

                  await File.WriteAllTextAsync(outputConnectionFile, builder.ConnectionString);
                  Console.WriteLine("PostgreSQL authentication test: SUCCESS (SELECT 1).");
                  Console.WriteLine("Npgsql connection string prepared for EF migration (not printed).");
                  return 0;
              }

              Console.Error.WriteLine("::error::PostgreSQL authentication test returned an unexpected result.");
              return 1;
          }
          catch (Exception ex)
          {
              Console.Error.WriteLine("PostgreSQL authentication test: FAILED");
              WriteSanitizedException(ex, secrets);
              return 1;
          }

          static bool IsPostgresUri(string value)
          {
              var start = value.TrimStart();
              return start.StartsWith("postgres://", StringComparison.OrdinalIgnoreCase)
                  || start.StartsWith("postgresql://", StringComparison.OrdinalIgnoreCase);
          }

          static NpgsqlConnectionStringBuilder ParsePostgresUri(string uriString)
          {
              if (!Uri.TryCreate(uriString, UriKind.Absolute, out var uri))
              {
                  throw new ArgumentException("PostgreSQL URI is not a valid absolute URI.");
              }

              var builder = new NpgsqlConnectionStringBuilder
              {
                  Host = uri.Host,
                  Port = uri.Port > 0 ? uri.Port : 5432,
              };

              var database = uri.AbsolutePath.TrimStart('/');
              if (!string.IsNullOrWhiteSpace(database))
              {
                  builder.Database = Uri.UnescapeDataString(database);
              }

              if (!string.IsNullOrEmpty(uri.UserInfo))
              {
                  var separatorIndex = uri.UserInfo.IndexOf(':');
                  if (separatorIndex >= 0)
                  {
                      builder.Username = Uri.UnescapeDataString(uri.UserInfo[..separatorIndex]);
                      builder.Password = Uri.UnescapeDataString(uri.UserInfo[(separatorIndex + 1)..]);
                  }
                  else
                  {
                      builder.Username = Uri.UnescapeDataString(uri.UserInfo);
                  }
              }

              var query = uri.Query.TrimStart('?');
              if (!string.IsNullOrEmpty(query))
              {
                  foreach (var pair in query.Split('&', StringSplitOptions.RemoveEmptyEntries))
                  {
                      var parts = pair.Split('=', 2);
                      if (parts.Length != 2)
                      {
                          continue;
                      }

                      ApplyUriQueryParameter(
                          builder,
                          Uri.UnescapeDataString(parts[0]),
                          Uri.UnescapeDataString(parts[1]));
                  }
              }

              return builder;
          }

          static void ApplyUriQueryParameter(NpgsqlConnectionStringBuilder builder, string key, string value)
          {
              if (key.Equals("sslmode", StringComparison.OrdinalIgnoreCase))
              {
                  builder.SslMode = Enum.Parse<SslMode>(value, ignoreCase: true);
              }
          }

          static void ApplyRenderExternalSslDefaults(NpgsqlConnectionStringBuilder builder)
          {
              if (builder.SslMode is SslMode.Disable or SslMode.Allow or SslMode.Prefer)
              {
                  builder.SslMode = SslMode.Require;
              }
          }

          static string[] BuildSecrets(
              string rawConnectionString,
              string trimmedConnectionString,
              NpgsqlConnectionStringBuilder builder)
          {
              return
              [
                  rawConnectionString,
                  trimmedConnectionString,
                  builder.ConnectionString,
                  builder.Password ?? string.Empty,
                  builder.Username ?? string.Empty
              ];
          }

          static string MaskUsername(string? username)
          {
              if (string.IsNullOrWhiteSpace(username))
              {
                  return "(not set)";
              }

              if (username.Length <= 2)
              {
                  return new string('*', username.Length);
              }

              var visible = Math.Min(2, username.Length);
              var maskedLength = Math.Min(username.Length - visible, 8);
              return $"{username[..visible]}{new string('*', maskedLength)} (length: {username.Length})";
          }

          static string Sanitize(string message, params string?[] secrets)
          {
              var sanitized = message;
              foreach (var secret in secrets)
              {
                  if (!string.IsNullOrEmpty(secret))
                  {
                      sanitized = sanitized.Replace(secret, "***", StringComparison.Ordinal);
                  }
              }

              sanitized = Regex.Replace(
                  sanitized,
                  @"postgres(?:ql)?://[^\s'""]+",
                  "postgresql://***",
                  RegexOptions.IgnoreCase | RegexOptions.CultureInvariant);
              return sanitized;
          }

          static void WriteSanitizedException(Exception ex, params string?[] secrets)
          {
              for (var current = ex; current is not null; current = current.InnerException)
              {
                  Console.Error.WriteLine($"Exception type: {current.GetType().FullName}");
                  Console.Error.WriteLine($"Message: {Sanitize(current.Message, secrets)}");
              }
          }
          EOF

          if [ ! -f "$PROJECT_FILE" ]; then
            echo "::error::Diagnostic project file was not created at $PROJECT_FILE"
            exit 1
          fi

          if [ ! -f "$PROGRAM_FILE" ]; then
            echo "::error::Diagnostic program file was not created at $PROGRAM_FILE"
            exit 1
          fi

          dotnet restore "$PROJECT_FILE" --verbosity quiet
          dotnet build "$PROJECT_FILE" -c Release --no-restore
          dotnet run --project "$PROJECT_FILE" -c Release --no-build

      - name: Install EF Core CLI
        run: dotnet tool install --global dotnet-ef --version 10.0.12

      - name: Restore dependencies
        run: dotnet restore src/MovieApp.Api/MovieApp.Api.csproj

      - name: Build startup project (Release)
        run: dotnet build src/MovieApp.Api/MovieApp.Api.csproj -c Release --no-restore

      - name: Apply EF Core migrations to production database
        run: |
          NPgsql_CONNECTION_FILE="$RUNNER_TEMP/npgsql-connection.txt"
          if [ ! -f "$NPgsql_CONNECTION_FILE" ]; then
            echo "::error::Npgsql connection file was not created by the diagnostic step."
            exit 1
          fi

          CONNECTION="$(cat "$NPgsql_CONNECTION_FILE")"
          dotnet ef database update \
            --project src/MovieApp.Infrastructure \
            --startup-project src/MovieApp.Api \
            --configuration Release \
            --connection "$CONNECTION" \
            --no-build

      - name: Migration complete
        run: echo "Production EF Core migrations applied successfully."

